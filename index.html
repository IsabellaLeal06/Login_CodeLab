<!doctype html>
<html lang="pt-br">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>Login | CodeLab</title>
  <link rel="stylesheet" href="https://fonts.googleapis.com/icon?family=Material+Icons" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link
    href="https://fonts.googleapis.com/css2?family=Archivo:ital,wght@0,100..900;1,100..900&family=Inter:ital,opsz,wght@0,14..32,100..900;1,14..32,100..900&family=Space+Grotesk:wght@300..700&display=swap"
    rel="stylesheet" />
  <link rel="stylesheet" href="./style.css" />
</head>

<body>
  <main>
    <div class="content">
      <section class="left">
        <div class="img">
          <img src="./img/vetor.svg" alt="" />
        </div>
      </section>
      <section class="right">
        

        <form action="">
          <div class="title">
          <h1>Bem-vindo de volta</h1>
          <h2>Faça login na sua conta</h2>
        </div>
          <label for="e-mail">E-mail:</label>
          <input type="email" name="e-mail" id="e-mail" placeholder="exemplo@gmail.com" style="color: #656769;" />
          <label for="password">Senha:</label>
          <input type="password" placeholder="0123456789" style="color: #656769;"/>

          <div class="remember"><input type="checkbox" id="checkbox" /><label>Lembre de mim</label>
          </div><a href=""><span>Esqueceu sua senha?</span></a>
          <button type="submit" id="submit">Entrar na conta</button>
          <button class="login-google">
           <img src="./img/logo_google.svg" alt="">Ou faça login com o google
          </button>
          <div class="createAccount"><span>Não tem uma conta?</span>
          <span></span><a href="#">Cadastre-se</a></span></div>
          
        </form>
      </section>
    </div>
  </main>
</body>

</html>
